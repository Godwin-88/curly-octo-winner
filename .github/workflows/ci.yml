name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only: CI builds and tests, it never writes to the repository.
permissions:
  contents: read

jobs:
  # Backstop for the gitignore rules that keep api/.env (live Supabase, Upstash,
  # Backblaze, Africa's Talking, Groq and M-Pesa credentials) and web/.env.local
  # out of history. Runs first and needs no toolchain, so a leak is reported
  # before any of the expensive jobs start.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a key reintroduced by a revert is still a leak.
          fetch-depth: 0
      - name: Scan tracked files for live credentials
        # Invoked via `bash` rather than `./scripts/...` so the check still runs
        # on a checkout that did not preserve the executable bit.
        run: bash ./scripts/secret-scan.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    # A real Postgres: the SMS dispatch tests check what is committed before the
    # provider is called and what a restart finds, which only a database shows.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shule360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shule360_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shule360_test?sslmode=disable
      SUPABASE_URL: http://localhost
      SUPABASE_SERVICE_ROLE_KEY: test
      JWT_SECRET: test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Verify dependencies
        run: go mod verify
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on: $unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Apply migrations
        run: go run ./cmd/migrate
      - name: Run tests
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shule360_test?sslmode=disable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Audit dependencies (blocks on prod high/critical)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build (Playwright starts the production server)
        run: npm run build
        env:
          # The smoke suite runs without the Go API by design: the same-origin
          # rewrite proxy answers 5xx and the app degrades to the sign-in
          # redirects. An origin is still set so the production build does not
          # warn about a missing proxy target.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
      - name: Run smoke tests (public surface + axe WCAG checks)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
