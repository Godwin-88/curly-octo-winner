name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test ./...
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shule360_test
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: test
          JWT_SECRET: test_secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
