services:
  - type: web
    name: shule360-api
    env: docker
    dockerfilePath: ./api/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
      - key: UPSTASH_SEARCH_REST_URL
        sync: false
      - key: UPSTASH_SEARCH_REST_TOKEN
        sync: false
      - key: B2_ACCOUNT_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: META_WA_TOKEN
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_WA_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORT_CODE
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_BASE_URL
        sync: false