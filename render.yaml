# Render Blueprint for the Shule360 Go API.
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo → Apply. Render
# reads this file from the repo root and provisions the service below. Entries
# marked `sync: false` are secrets: Render prompts for them in the dashboard
# and they are never committed to git.
#
# Notes
# - Native Go runtime with rootDir: api — Render builds ./cmd/server and runs
#   it. PORT is set to 8080 to match config.Load()'s default and the
#   Dockerfile's EXPOSE; Render routes web traffic to whatever PORT says.
# - Migrations are not part of a Render deploy. Apply them from a machine that
#   can reach the database:
#       cd api && DATABASE_URL=... go run ./cmd/migrate
#   On a paid instance type you can instead automate it by adding
#       preDeployCommand: go run ./cmd/migrate
#   (pre-deploy commands are not available on the free plan).
# - Free instances spin down after ~15 minutes idle, so the first request after
#   a quiet period pays a cold-start penalty (~1 min). Use the starter plan for
#   a production school.
services:
  - type: web
    name: shule360-api
    runtime: go
    rootDir: api
    plan: free
    region: frankfurt
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Seals the per-school integration credentials entered in Settings. Set a
      # dedicated value: rotating it means re-entering every school's keys.
      # Without it the API falls back to JWT_SECRET.
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
      - key: UPSTASH_SEARCH_REST_URL
        sync: false
      - key: UPSTASH_SEARCH_REST_TOKEN
        sync: false
      - key: B2_ACCOUNT_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        sync: false
      # Secret path segment of the SMS delivery-report callback. Set the
      # callback in the Africa's Talking dashboard to
      #   https://<api host>/api/v1/webhooks/sms/dlr/<this value>
      # Without it delivery reports are refused and messages stay at "sent".
      - key: AT_DLR_TOKEN
        sync: false
      - key: META_WA_TOKEN
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_WA_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORT_CODE
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_BASE_URL
        sync: false

      # --- strongly recommended ---
      - key: SIGNUP_MODE
        value: closed
      - key: SIGNUP_CODE
        sync: false
      - key: MPESA_WEBHOOK_TOKEN
        sync: false
      - key: MPESA_ALLOWED_IPS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false

      # --- intelligence (AI assistant + template suggestions) ---
      - key: GROQ_API_KEY
        sync: false